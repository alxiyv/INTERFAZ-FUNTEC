<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>RailTrack</title>
<style>
:root{--bg:#14181c;--card:#1e252b;--line:#33404a;--tx:#e8edf0;--mut:#8fa0ab;--ac:#4fc3a1;--red:#e5484d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--line)}
#dot{width:12px;height:12px;border-radius:50%;background:var(--red)}#dot.on{background:var(--ac)}
#pos{font:600 22px ui-monospace,monospace;flex:1}#estop{background:var(--red);color:#fff;font-weight:700;padding:12px 18px;border-radius:8px}
nav{display:flex;overflow-x:auto;border-bottom:1px solid var(--line)}nav button{flex:1;padding:12px;background:none;color:var(--mut);border:0;border-bottom:3px solid transparent}
nav button.on{color:var(--tx);border-color:var(--ac)}main{max-width:720px;margin:auto;padding:14px}
section{display:none}section.on{display:block}h3{margin:18px 0 8px;font-size:15px;color:var(--mut);font-weight:600}
button{font:inherit;color:var(--tx);background:#2a343c;border:1px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac)}button.p{background:var(--ac);color:#08211a;border:0;font-weight:600}
input,select{font:inherit;color:var(--tx);background:#0f1317;border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
.r{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.r>*{flex:1;min-width:70px}label{font-size:13px;color:var(--mut)}
.big{font:700 40px ui-monospace,monospace;text-align:center;padding:8px}.item{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.item span{flex:2}
#msg{position:fixed;bottom:12px;left:12px;right:12px;padding:12px;border-radius:8px;background:#3a1d20;display:none;text-align:center}#msg.ok{background:#16352b}
img{width:100%;border-radius:8px;background:#000;min-height:180px}
</style></head><body>
<header><div id="dot"></div><div id="pos">— mm</div><span id="st" style="color:var(--mut)"></span><button id="estop" onclick="cmd('estop')">PARAR</button></header>
<nav><button data-t="m" class="on">Manual</button><button data-t="s">Stop motion</button><button data-t="t">Seguimiento</button><button data-t="a">Ajustes</button></nav>
<main>
<section id="m" class="on">
 <h3>Mover</h3><div class="r"><button onclick="mv(-10)">−10</button><button onclick="mv(-1)">−1</button><button onclick="mv(1)">+1</button><button onclick="mv(10)">+10</button></div>
 <label>Ir a posición (mm)</label><div class="r"><input id="g" type="number" step="0.1" value="0"><button class="p" onclick="goTo(+g.value)">Ir</button></div>
 <input id="sl" type="range" min="0" max="800" step="0.1" onchange="goTo(+this.value)" aria-label="Posición fina">
 <div class="r"><button onclick="cmd('home')">HOME</button><button onclick="cmd('stop')">Detener</button><button onclick="cmd('reset')">Reiniciar</button></div>
 <h3>Posiciones guardadas</h3><div class="r"><input id="pn" placeholder="Nombre (ej. Escena 3 inicio)"><button class="p" onclick="addPos()">Guardar aquí</button></div><div id="pl"></div>
 <h3>Sesión</h3><div class="r"><input id="sn" list="sl2" placeholder="Nombre de sesión"><datalist id="sl2"></datalist><button onclick="openS()">Abrir o crear</button><button onclick="location='/api/export'">Exportar</button></div><div id="cs" style="color:var(--mut)"></div>
</section>
<section id="s">
 <div class="big" id="fr">Fotograma 0</div>
 <div class="r"><button onclick="step(-1)">◀ Retroceder</button><button class="p" onclick="step(1)">Avanzar ▶</button><button onclick="post('/api/sm/undo')">Deshacer (Z)</button></div>
 <label>Paso por fotograma (mm)</label><input id="stp" type="number" step="0.1" value="0.5">
 <h3>Marcadores y recorrido en pasos iguales</h3>
 <div class="r"><button onclick="post('/api/sm/marker',{which:'start'})">Inicio = aquí</button><button onclick="post('/api/sm/marker',{which:'end'})">Fin = aquí</button></div>
 <div id="mk" style="color:var(--mut)"></div>
 <div class="r"><input id="ln" type="number" value="10" min="2" aria-label="Puntos"><input id="li" type="number" value="0" min="0" aria-label="Punto actual"><button onclick="lerp()">Ir al punto</button></div>
 <h3>Retomar sesión</h3><button onclick="resume()">Retomar: HOME y volver a la última posición</button>
 <p style="color:var(--mut);font-size:13px">Atajos: ← retrocede, → avanza, Z deshace, Esc para.</p>
</section>
<section id="t">
 <img src="/video" alt="Vista de la cámara con detección">
 <div class="r"><button class="p" onclick="post('/api/track/start')">Activar seguimiento</button><button onclick="post('/api/track/stop')">Desactivar</button></div>
 <label>Zona muerta (%)</label><input id="dz" type="number" step="1" onchange="setCfg()"><label>Ganancia (0 a 1)</label><input id="gn" type="number" step="0.1" onchange="setCfg()">
</section>
<section id="a">
 <label>Longitud útil del riel (mm)</label><input id="tv" type="number" onchange="setCfg()"><label>Velocidad (mm/s)</label><input id="sp" type="number" onchange="setCfg()">
 <p style="color:var(--mut);font-size:13px">Los pasos por mm se configuran solo en el firmware (Persona 3). Aquí todo va en milímetros.</p>
</section></main><div id="msg"></div>
<script>
const $=id=>document.getElementById(id);let S={},tab='m';
function toast(t,ok){const m=$('msg');m.textContent=t;m.className=ok?'ok':'';m.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>m.style.display='none',3500)}
async function post(u,b,method='POST'){try{const r=await fetch(u,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});const j=await r.json();if(!j.ok)toast(j.error||'Error');refresh();return j}catch(e){toast('Sin conexión con el servidor')}}
const cmd=c=>post('/api/cmd/'+c),mv=d=>post('/api/move',{mm:d}),goTo=mm=>post('/api/goto',{mm}),step=k=>post('/api/sm/step',{dir:k,step:+$('stp').value});
const lerp=()=>post('/api/sm/lerp',{i:+$('li').value,n:+$('ln').value});
async function resume(){if(confirm('El carro hará HOME y luego irá a '+S.session.last_mm+' mm. ¿Continuar?'))post('/api/sm/resume')}
const addPos=async()=>{if(!$('pn').value)return toast('Escribe un nombre');await post('/api/positions',{name:$('pn').value});$('pn').value=''};
const openS=async()=>{await post('/api/sessions',{name:$('sn').value});loadList()};
const setCfg=()=>post('/api/settings',{travel_mm:$('tv').value,speed:$('sp').value,deadzone:$('dz').value,gain:$('gn').value});
async function refresh(){try{S=await (await fetch('/api/status')).json()}catch(e){$('dot').className='';return}
 const s=S.session;$('dot').className=S.connected?'on':'';$('pos').textContent=S.pos.toFixed(2)+' mm';
 $('st').textContent=S.busy||(S.connected?S.state:'Sin conexión con el ESP32');if(S.error)$('st').textContent=S.error;
 $('fr').textContent='Fotograma '+s.frame;$('cs').textContent='Sesión: '+s.name+' · última posición '+s.last_mm+' mm';
 $('mk').textContent='Inicio: '+(s.markers.start??'—')+' mm · Fin: '+(s.markers.end??'—')+' mm';$('sl').max=S.cfg.travel_mm;
 $('pl').innerHTML=s.positions.length?s.positions.map(p=>`<div class="item"><span>${p.name}</span><b>${p.mm} mm</b><button onclick="post('/api/positions/'+encodeURIComponent('${p.name}')+'/go')">Ir</button><button onclick="post('/api/positions/'+encodeURIComponent('${p.name}'),{},'DELETE')">Borrar</button></div>`).join(''):'<p style="color:var(--mut)">Aún no hay posiciones. Mueve el carro y guarda una.</p>';
 for(const [id,k] of [['tv','travel_mm'],['sp','speed'],['dz','deadzone'],['gn','gain']])if(document.activeElement.id!==id)$(id).value=S.cfg[k];
 if(document.activeElement.id!=='stp')$('stp').value=s.step_mm}
async function loadList(){const l=await (await fetch('/api/sessions')).json();$('sl2').innerHTML=l.map(x=>`<option value="${x.name}">`).join('')}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('nav button,section').forEach(e=>e.classList.remove('on'));b.classList.add('on');$(tab).classList.add('on')});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='Escape')cmd('estop');if(tab!=='s')return;
 if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);if(e.key==='z')post('/api/sm/undo')});
refresh();loadList();setInterval(refresh,400);
</script></body></html>
